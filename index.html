<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Bookmarks</title>
<style>
  /* ── Reset & Base ───────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #1a1a18;
    --surface:     #242420;
    --surface2:    #2e2e29;
    --border:      #3a3a34;
    --accent:      #c8873a;
    --accent-dim:  #8a5a22;
    --accent-glow: rgba(200,135,58,0.18);
    --text:        #e8e4da;
    --text-muted:  #8a8678;
    --text-dim:    #5a5850;
    --green:       #5a9e6a;
    --row-alt:     rgba(255,255,255,0.025);
    --row-hover:   rgba(200,135,58,0.08);
    --row-sel:     rgba(200,135,58,0.15);
    --radius:      6px;
    --ff-display:  'Georgia', 'Times New Roman', serif;
    --ff-body:     'Segoe UI', system-ui, sans-serif;
    --ff-mono:     'Consolas', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--ff-body);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px 14px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 {
    font-family: var(--ff-display);
    font-size: 22px;
    font-weight: normal;
    color: var(--accent);
    letter-spacing: 0.03em;
  }
  header .subtitle {
    color: var(--text-muted);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ── Layout ─────────────────────────────────────────────────── */
  .shell {
    display: grid;
    grid-template-rows: auto 1fr;
    height: calc(100vh - 57px);
  }

  /* ── Filter bar ─────────────────────────────────────────────── */
  .filters {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    gap: 14px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .filter-group label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }
  .filter-group input,
  .filter-group select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--ff-body);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .filter-group input { width: 260px; }
  .filter-group select { width: 200px; cursor: pointer; }
  .filter-group input:focus,
  .filter-group select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }
  .filter-group input::placeholder { color: var(--text-dim); }

  .filter-actions {
    display: flex;
    gap: 8px;
    padding-bottom: 1px;
    margin-left: auto;
    align-items: flex-end;
  }
  .btn {
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: var(--ff-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 18px;
    transition: opacity 0.15s, background 0.15s;
    white-space: nowrap;
  }
  .btn:active { opacity: 0.8; }
  .btn-primary {
    background: var(--accent);
    color: #1a1a18;
  }
  .btn-primary:disabled {
    background: var(--accent-dim);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .btn-ghost {
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }

  /* ── Results area ────────────────────────────────────────────── */
  .results-wrap {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 0 28px 20px;
  }

  /* ── Status bar ─────────────────────────────────────────────── */
  .statusbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 0 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .statusbar .count {
    font-size: 12px;
    color: var(--text-muted);
  }
  .statusbar .count strong { color: var(--accent); }
  .statusbar .sel-count {
    font-size: 12px;
    color: var(--green);
  }
  .statusbar .spacer { flex: 1; }
  .select-all-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.1s;
  }
  .select-all-btn:hover { color: var(--accent); }

  /* ── Table ───────────────────────────────────────────────────── */
  .table-scroll {
    overflow-y: auto;
    flex: 1;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-top: 2px;
  }
  .table-scroll::-webkit-scrollbar { width: 6px; }
  .table-scroll::-webkit-scrollbar-track { background: var(--surface); }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface2);
  }
  thead th {
    padding: 10px 14px;
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th:first-child { width: 36px; }
  thead th:nth-child(2) { width: 40%; }
  thead th:nth-child(3) { width: 20%; }
  thead th:nth-child(4) { width: 13%; }
  thead th:nth-child(5) { width: 36px; text-align: center; }
  thead th:last-child   { width: 44px; }

  tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
    transition: background 0.08s;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.selected { background: var(--row-sel) !important; }

  td {
    padding: 9px 14px;
    vertical-align: middle;
  }
  td:first-child { text-align: center; }

  /* Checkbox */
  input[type=checkbox] {
    appearance: none;
    width: 15px; height: 15px;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
    cursor: pointer;
    position: relative;
    transition: border-color 0.1s, background 0.1s;
    flex-shrink: 0;
    vertical-align: middle;
  }
  input[type=checkbox]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  input[type=checkbox]:checked::after {
    content: '';
    position: absolute;
    left: 3px; top: 0px;
    width: 5px; height: 9px;
    border: 2px solid #1a1a18;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
  }

  .title-cell {
    color: var(--text);
    font-size: 13px;
    line-height: 1.35;
  }
  .cat-badge {
    display: inline-block;
    background: rgba(200,135,58,0.12);
    border: 1px solid rgba(200,135,58,0.25);
    color: var(--accent);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .prot-badge {
    display: inline-block;
    background: rgba(90,158,106,0.12);
    border: 1px solid rgba(90,158,106,0.25);
    color: var(--green);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 20px;
  }

  /* ── Empty state ─────────────────────────────────────────────── */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty .icon { font-size: 36px; margin-bottom: 10px; }
  .empty p { font-size: 14px; }

  /* ── Open button bar ─────────────────────────────────────────── */
  .open-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 12px;
  }
  .open-bar .hint {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* ── Link panel ──────────────────────────────────────────────── */
  #linkPanel {
    margin-top: 10px;
    background: var(--surface);
    border: 1px solid var(--accent-dim);
    border-radius: var(--radius);
    overflow: hidden;
    flex-shrink: 0;
    max-height: 220px;
    display: flex;
    flex-direction: column;
  }
  .link-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    flex-shrink: 0;
  }
  #linkList {
    overflow-y: auto;
    padding: 6px 0;
  }
  #linkList::-webkit-scrollbar { width: 5px; }
  #linkList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .link-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 5px 14px;
  }
  .link-item:hover { background: var(--row-hover); }
  .link-num {
    font-size: 10px;
    color: var(--text-dim);
    min-width: 20px;
    text-align: right;
    flex-shrink: 0;
  }
  .link-item a {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    line-height: 1.3;
  }
  .link-item a:hover { text-decoration: underline; }
  .link-item a:visited { color: var(--text-muted); }

  /* ── Favorites toggle button ─────────────────────────────────── */
  .btn-fav {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    transition: all 0.15s;
  }
  .btn-fav:hover { color: var(--accent); border-color: var(--accent-dim); }
  .btn-fav.active {
    background: rgba(200,135,58,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Add Recipe panel ────────────────────────────────────────── */
  #addPanel {
    margin-top: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    flex-shrink: 0;
  }
  .add-form {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .add-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .add-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .add-field label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }
  .add-field input, .add-field select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--ff-body);
    font-size: 13px;
    padding: 6px 10px;
    outline: none;
    min-width: 180px;
    transition: border-color 0.15s;
  }
  .add-field input:focus, .add-field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }
  .add-field.wide input { min-width: 280px; }
  .add-field.add-submit { flex-direction: row; align-items: center; gap: 10px; }
  .req { color: var(--accent); }
  #addMsg { font-size: 12px; color: var(--green); }
  #addMsg.error { color: #e05555; }

  /* ── Star button ─────────────────────────────────────────────── */
  .star-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 5px;
    border-radius: 4px;
    line-height: 1;
    transition: color 0.12s, transform 0.1s;
  }
  .star-btn:hover { color: var(--accent); transform: scale(1.2); }
  .star-btn.starred { color: #f0b429; }

  /* ── Fav count badge in statusbar ────────────────────────────── */
  .fav-count {
    font-size: 12px;
    color: #f0b429;
  }
  .del-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
    transition: color 0.12s, background 0.12s;
  }
  .del-btn:hover { color: #e05555; background: rgba(224,85,85,0.12); }

  /* ── Undo toast ──────────────────────────────────────────────── */
  #undoToast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--text);
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), opacity 0.25s;
    opacity: 0;
    z-index: 999;
    white-space: nowrap;
  }
  #undoToast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  #undoToast button {
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #1a1a18;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
  }
  #undoToast button:hover { opacity: 0.85; }
</style>
</head>
<body>

<header>
  <h1>&#127859; Recipe Bookmarks</h1>
  <span class="subtitle" id="headerSubtitle">keyword search &amp; filter</span>
</header>

<div class="shell">
  <div class="filters">
    <div class="filter-group">
      <label>Search title</label>
      <input type="text" id="q" placeholder="e.g. chocolate, brisket, enchilada…" autocomplete="off">
    </div>
    <div class="filter-group">
      <label>Category</label>
      <select id="catFilter">
        <option value="">All Categories</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Protein</label>
      <select id="protFilter">
        <option value="">All Proteins</option>
      </select>
    </div>
    <div class="filter-actions">
      <button class="btn btn-fav" id="favFilterBtn" title="Show favorites only">☆ Favorites</button>
      <button class="btn btn-ghost" id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="results-wrap">
    <div class="statusbar">
      <span class="count" id="countLabel">Showing <strong>0</strong> recipes</span>
      <span class="sel-count" id="selLabel" style="display:none"></span>
      <span class="fav-count" id="favLabel"></span>
      <span class="spacer"></span>
      <button class="select-all-btn" id="selectAllBtn">Select all visible</button>
    </div>

    <div class="table-scroll" id="tableWrap">
      <table id="recipeTable">
        <thead>
          <tr>
            <th></th>
            <th>Title</th>
            <th>Category</th>
            <th>Protein</th>
            <th title="Favorite">☆</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="open-bar">
      <button class="btn btn-primary" id="openBtn" disabled>Open selected in tabs</button>
      <button class="btn btn-ghost" id="addRecipeToggle">＋ Add Recipe</button>
      <button class="btn btn-ghost" id="importBtn">⬆ Import CSV/Excel</button>
      <input type="file" id="importFileInput" accept=".csv" style="display:none">
      <button class="btn btn-ghost" id="exportBtn">⬇ Export Excel</button>
      <span class="hint" id="openHint">Select one or more recipes, then click to open their links.</span>
    </div>

    <!-- Add Recipe panel -->
    <div id="addPanel" style="display:none">
      <div class="link-panel-header">
        <span>Add a New Recipe</span>
        <button class="select-all-btn" id="closeAddPanel">✕ Close</button>
      </div>
      <div class="add-form">
        <div class="add-row">
          <div class="add-field">
            <label>Title <span class="req">*</span></label>
            <input type="text" id="addTitle" placeholder="Recipe name">
          </div>
          <div class="add-field wide">
            <label>URL <span class="req">*</span></label>
            <input type="text" id="addUrl" placeholder="https://...">
          </div>
        </div>
        <div class="add-row">
          <div class="add-field">
            <label>Category</label>
            <select id="addCat"><option value="">— Select —</option></select>
          </div>
          <div class="add-field">
            <label>Protein</label>
            <select id="addProt"><option value="">— Select —</option></select>
          </div>
          <div class="add-field add-submit">
            <button class="btn btn-primary" id="addSubmit">Add Recipe</button>
            <span id="addMsg"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Link panel: shown after clicking "Open selected in tabs" -->
    <div id="linkPanel" style="display:none">
      <div class="link-panel-header">
        <span id="linkPanelLabel"></span>
        <button class="select-all-btn" id="closeLinkPanel">✕ Close</button>
      </div>
      <div id="linkList"></div>
    </div>
  </div>
</div>

<div id="undoToast">
  <span id="undoMsg"></span>
  <button id="undoBtn">Undo</button>
</div>

<script>
// Initial Data
const INITIAL_RECIPES = [];

// App State
let recipes = JSON.parse(localStorage.getItem('my_recipes')) || [];
let favorites = new Set(JSON.parse(localStorage.getItem('my_fav_recipes') || "[]"));
let selectedIndexes = new Set();
let showFavsOnly = false;
let lastDeletedRecipe = null;
let lastDeletedIndex = null;
let toastTimer = null;

// DOM Elements
const qInput = document.getElementById('q');
const catSelect = document.getElementById('catFilter');
const protSelect = document.getElementById('protFilter');
const favFilterBtn = document.getElementById('favFilterBtn');
const clearBtn = document.getElementById('clearBtn');
const tbody = document.getElementById('tbody');
const countLabel = document.getElementById('countLabel');
const selLabel = document.getElementById('selLabel');
const favLabel = document.getElementById('favLabel');
const selectAllBtn = document.getElementById('selectAllBtn');
const openBtn = document.getElementById('openBtn');
const addRecipeToggle = document.getElementById('addRecipeToggle');
const addPanel = document.getElementById('addPanel');
const closeAddPanel = document.getElementById('closeAddPanel');
const addCatSelect = document.getElementById('addCat');
const addProtSelect = document.getElementById('addProt');
const addSubmit = document.getElementById('addSubmit');
const addMsg = document.getElementById('addMsg');
const importBtn = document.getElementById('importBtn');
const importFileInput = document.getElementById('importFileInput');
const exportBtn = document.getElementById('exportBtn');
const linkPanel = document.getElementById('linkPanel');
const closeLinkPanel = document.getElementById('closeLinkPanel');
const linkList = document.getElementById('linkList');
const linkPanelLabel = document.getElementById('linkPanelLabel');
const undoToast = document.getElementById('undoToast');
const undoMsg = document.getElementById('undoMsg');
const undoBtn = document.getElementById('undoBtn');
const headerSubtitle = document.getElementById('headerSubtitle');

// Setup Dropdown Options
function populateDropdowns() {
  const cats = [...new Set(recipes.map(r => r.category).filter(Boolean))].sort();
  const prots = [...new Set(recipes.map(r => r.protein).filter(Boolean))].sort();

  catSelect.innerHTML = '<option value="">All Categories</option>';
  cats.forEach(c => catSelect.add(new Option(c, c)));

  protSelect.innerHTML = '<option value="">All Proteins</option>';
  prots.forEach(p => protSelect.add(new Option(p, p)));

  addCatSelect.innerHTML = '<option value="">— Select —</option>';
  cats.forEach(c => addCatSelect.add(new Option(c, c)));

  addProtSelect.innerHTML = '<option value="">— Select —</option>';
  prots.forEach(p => addProtSelect.add(new Option(p, p)));
}

// Save Data
function saveData() {
  localStorage.setItem('my_recipes', JSON.stringify(recipes));
  localStorage.setItem('my_fav_recipes', JSON.stringify([...favorites]));
}

// Filter and Render
function getFilteredRecipes() {
  const q = qInput.value.toLowerCase().trim();
  const cat = catSelect.value;
  const prot = protSelect.value;

  return recipes.map((r, i) => ({...r, originalIndex: i})).filter(r => {
    if (showFavsOnly && !favorites.has(r.originalIndex)) return false;
    if (cat && r.category !== cat) return false;
    if (prot && r.protein !== prot) return false;
    if (q && !r.title.toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  const filtered = getFilteredRecipes();
  tbody.innerHTML = '';

  headerSubtitle.textContent = `${recipes.length.toLocaleString()} recipes • keyword search & filter`;
  countLabel.innerHTML = `Showing <strong>${filtered.length}</strong> recipes`;
  favLabel.textContent = favorites.size ? `★ ${favorites.size} favs` : '';

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty"><div class="icon">🔍</div><p>No recipes found matching your filters.</p></td></tr>`;
  } else {
    filtered.forEach(r => {
      const idx = r.originalIndex;
      const isSelected = selectedIndexes.has(idx);
      const isStarred = favorites.has(idx);

      const tr = document.createElement('tr');
      if (isSelected) tr.classList.add('selected');

      tr.innerHTML = `
        <td><input type="checkbox" data-idx="${idx}" ${isSelected ? 'checked' : ''}></td>
        <td class="title-cell"><a href="${r.url}" target="_blank" style="color:inherit;text-decoration:none;" onclick="event.stopPropagation();">${r.title}</a></td>
        <td><span class="cat-badge">${r.category || 'Uncategorized'}</span></td>
        <td><span class="prot-badge">${r.protein || 'N/A'}</span></td>
        <td style="text-align:center"><button class="star-btn ${isStarred ? 'starred' : ''}" data-idx="${idx}">${isStarred ? '★' : '☆'}</button></td>
        <td><button class="del-btn" data-idx="${idx}" title="Delete recipe">✕</button></td>
      `;

      // Event handlers
      tr.addEventListener('click', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.classList.contains('star-btn') || e.target.classList.contains('del-btn') || e.target.tagName === 'A') return;
        toggleSelect(idx);
      });

      const chk = tr.querySelector('input[type="checkbox"]');
      chk.addEventListener('change', () => toggleSelect(idx));

      const starBtn = tr.querySelector('.star-btn');
      starBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFav(idx);
      });

      const delBtn = tr.querySelector('.del-btn');
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteRecipe(idx);
      });

      tbody.appendChild(tr);
    });
  }

  updateSelectionState();
}

function toggleSelect(idx) {
  if (selectedIndexes.has(idx)) {
    selectedIndexes.delete(idx);
  } else {
    selectedIndexes.add(idx);
  }
  render();
}

function toggleFav(idx) {
  if (favorites.has(idx)) {
    favorites.delete(idx);
  } else {
    favorites.add(idx);
  }
  saveData();
  render();
}

function deleteRecipe(idx) {
  lastDeletedRecipe = recipes[idx];
  lastDeletedIndex = idx;
  recipes.splice(idx, 1);
  
  // Shift favorite indices if necessary
  const newFavs = new Set();
  favorites.forEach(f => {
    if (f < idx) newFavs.add(f);
    else if (f > idx) newFavs.add(f - 1);
  });
  favorites = newFavs;
  selectedIndexes.delete(idx);

  saveData();
  populateDropdowns();
  render();
  showUndoToast(`Deleted "${lastDeletedRecipe.title}"`);
}

function showUndoToast(msg) {
  undoMsg.textContent = msg;
  undoToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => undoToast.classList.remove('show'), 5000);
}

undoBtn.addEventListener('click', () => {
  if (lastDeletedRecipe !== null) {
    recipes.splice(lastDeletedIndex, 0, lastDeletedRecipe);
    saveData();
    populateDropdowns();
    render();
    undoToast.classList.remove('show');
    lastDeletedRecipe = null;
  }
});

function updateSelectionState() {
  const count = selectedIndexes.size;
  if (count > 0) {
    selLabel.style.display = 'inline';
    selLabel.innerHTML = `<strong>${count}</strong> selected`;
    openBtn.disabled = false;
  } else {
    selLabel.style.display = 'none';
    openBtn.disabled = true;
  }
}

// Batch Actions
selectAllBtn.addEventListener('click', () => {
  const filtered = getFilteredRecipes();
  const allSelected = filtered.every(r => selectedIndexes.has(r.originalIndex));

  filtered.forEach(r => {
    if (allSelected) selectedIndexes.delete(r.originalIndex);
    else selectedIndexes.add(r.originalIndex);
  });
  render();
});

// Open Selected
openBtn.addEventListener('click', () => {
  const selectedRecipes = [...selectedIndexes].map(i => recipes[i]).filter(Boolean);
  if (selectedRecipes.length === 0) return;

  linkList.innerHTML = '';
  linkPanelLabel.textContent = `Selected Recipes (${selectedRecipes.length})`;

  selectedRecipes.forEach((r, i) => {
    window.open(r.url, '_blank');
    const div = document.createElement('div');
    div.className = 'link-item';
    div.innerHTML = `<span class="link-num">${i + 1}.</span> <a href="${r.url}" target="_blank">${r.title}</a>`;
    linkList.appendChild(div);
  });

  linkPanel.style.display = 'flex';
});

closeLinkPanel.addEventListener('click', () => {
  linkPanel.style.display = 'none';
});

// Add Recipe
addRecipeToggle.addEventListener('click', () => {
  addPanel.style.display = addPanel.style.display === 'none' ? 'block' : 'none';
});

closeAddPanel.addEventListener('click', () => {
  addPanel.style.display = 'none';
});

addSubmit.addEventListener('click', () => {
  const title = document.getElementById('addTitle').value.trim();
  const url = document.getElementById('addUrl').value.trim();
  const category = addCatSelect.value;
  const protein = addProtSelect.value;

  if (!title || !url) {
    addMsg.className = 'error';
    addMsg.textContent = 'Title and URL are required!';
    return;
  }

  recipes.unshift({ title, url, category: category || 'Uncategorized', protein: protein || 'N/A' });
  saveData();
  populateDropdowns();
  render();

  document.getElementById('addTitle').value = '';
  document.getElementById('addUrl').value = '';
  addMsg.className = '';
  addMsg.textContent = 'Recipe added!';
  setTimeout(() => { addMsg.textContent = ''; }, 3000);
});

// Filter Controls
qInput.addEventListener('input', render);
catSelect.addEventListener('change', render);
protSelect.addEventListener('change', render);

favFilterBtn.addEventListener('click', () => {
  showFavsOnly = !showFavsOnly;
  favFilterBtn.classList.toggle('active', showFavsOnly);
  render();
});

clearBtn.addEventListener('click', () => {
  qInput.value = '';
  catSelect.value = '';
  protSelect.value = '';
  showFavsOnly = false;
  favFilterBtn.classList.remove('active');
  selectedIndexes.clear();
  render();
});

// CSV Export
exportBtn.addEventListener('click', () => {
  const visible = getFilteredRecipes();
  if (visible.length === 0) {
    alert("No recipes available to export.");
    return;
  }

  let csvContent = "data:text/csv;charset=utf-8,Title,URL,Category,Protein\n";
  visible.forEach(r => {
    const title = `"${(r.title || '').replace(/"/g, '""')}"`;
    const url = `"${(r.url || '').replace(/"/g, '""')}"`;
    const cat = `"${(r.category || '').replace(/"/g, '""')}"`;
    const prot = `"${(r.protein || '').replace(/"/g, '""')}"`;
    csvContent += `${title},${url},${cat},${prot}\n`;
  });

  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "recipe_bookmarks.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
});

// CSV Import
importBtn.addEventListener('click', () => importFileInput.click());

importFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (evt) => {
    const text = evt.target.result;
    const lines = text.split(/\r\n|\n/);
    let importedCount = 0;

    lines.forEach((line, index) => {
      if (index === 0 && line.toLowerCase().includes('title')) return; // skip header
      const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
      if (cols.length >= 2 && cols[0] && cols[1]) {
        recipes.unshift({
          title: cols[0],
          url: cols[1],
          category: cols[2] || 'Uncategorized',
          protein: cols[3] || 'N/A'
        });
        importedCount++;
      }
    });

    if (importedCount > 0) {
      saveData();
      populateDropdowns();
      render();
      alert(`Successfully imported ${importedCount} recipes!`);
    } else {
      alert("No valid recipe rows found in the CSV file.");
    }
    importFileInput.value = '';
  };
  reader.readAsText(file);
});

// Init
populateDropdowns();
// Listen for new recipes sent from the extension
// Cross-browser compatibility wrapper
const browserAPI = typeof browser !== "undefined" ? browser : chrome;

// Synchronize storage across popup and dashboard
async function syncRecipesFromStorage() {
  if (browserAPI && browserAPI.storage) {
    const data = await browserAPI.storage.local.get("my_recipes");
    if (data.my_recipes) {
      recipes = data.my_recipes;
      localStorage.setItem('my_recipes', JSON.stringify(recipes));
      populateDropdowns();
      render();
    }
  }
}

// Initial Sync
syncRecipesFromStorage();

// Listen for custom events dispatched by content.js
window.addEventListener("ExtensionAddRecipe", (e) => {
  if (e.detail) {
    const newRecipe = e.detail;
    
    // Add new recipe to the top of the array
    recipes.unshift(newRecipe);
    
    // Save to local storage and refresh the UI
    saveData();
    populateDropdowns();
    render();

    console.log("✓ Added recipe from extension:", newRecipe.title);
  }
});

// Initial Render
populateDropdowns();
render();
</script>
</body>
</html>
