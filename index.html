<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Bookmarks</title>
<style>
  /* ── Reset & Base ───────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #1a1a18;
    --surface:     #242420;
    --surface2:    #2e2e29;
    --border:      #3a3a34;
    --accent:      #c8873a;
    --accent-dim:  #8a5a22;
    --accent-glow: rgba(200,135,58,0.18);
    --text:        #e8e4da;
    --text-muted:  #8a8678;
    --text-dim:    #5a5850;
    --green:       #5a9e6a;
    --row-alt:     rgba(255,255,255,0.025);
    --row-hover:   rgba(200,135,58,0.08);
    --row-sel:     rgba(200,135,58,0.15);
    --radius:      6px;
    --ff-display:  'Georgia', 'Times New Roman', serif;
    --ff-body:     'Segoe UI', system-ui, sans-serif;
    --ff-mono:     'Consolas', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--ff-body);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ─────────────────────────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px 14px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 {
    font-family: var(--ff-display);
    font-size: 22px;
    font-weight: normal;
    color: var(--accent);
    letter-spacing: 0.03em;
  }
  header .subtitle {
    color: var(--text-muted);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ── Layout ─────────────────────────────────────────────────── */
  .shell {
    display: grid;
    grid-template-rows: auto 1fr;
    height: calc(100vh - 57px);
  }

  /* ── Filter bar ─────────────────────────────────────────────── */
  .filters {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    gap: 14px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .filter-group label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }
  .filter-group input,
  .filter-group select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--ff-body);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .filter-group input { width: 260px; }
  .filter-group select { width: 200px; cursor: pointer; }
  .filter-group input:focus,
  .filter-group select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }
  .filter-group input::placeholder { color: var(--text-dim); }

  .filter-actions {
    display: flex;
    gap: 8px;
    padding-bottom: 1px;
    margin-left: auto;
    align-items: flex-end;
  }
  .btn {
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: var(--ff-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 18px;
    transition: opacity 0.15s, background 0.15s;
    white-space: nowrap;
  }
  .btn:active { opacity: 0.8; }
  .btn-primary {
    background: var(--accent);
    color: #1a1a18;
  }
  .btn-primary:disabled {
    background: var(--accent-dim);
    color: var(--text-dim);
    cursor: not-allowed;
  }
  .btn-ghost {
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }

  /* ── Results area ────────────────────────────────────────────── */
  .results-wrap {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 0 28px 20px;
  }

  /* ── Status bar ─────────────────────────────────────────────── */
  .statusbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 0 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .statusbar .count {
    font-size: 12px;
    color: var(--text-muted);
  }
  .statusbar .count strong { color: var(--accent); }
  .statusbar .sel-count {
    font-size: 12px;
    color: var(--green);
  }
  .statusbar .spacer { flex: 1; }
  .select-all-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.1s;
  }
  .select-all-btn:hover { color: var(--accent); }

  /* ── Table ───────────────────────────────────────────────────── */
  .table-scroll {
    overflow-y: auto;
    flex: 1;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-top: 2px;
  }
  .table-scroll::-webkit-scrollbar { width: 6px; }
  .table-scroll::-webkit-scrollbar-track { background: var(--surface); }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface2);
  }
  thead th {
    padding: 10px 14px;
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th:first-child { width: 36px; }
  thead th:nth-child(2) { width: 42%; }
  thead th:nth-child(3) { width: 20%; }
  thead th:nth-child(4) { width: 14%; }
  thead th:last-child   { width: 44px; }

  tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
    transition: background 0.08s;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.selected { background: var(--row-sel) !important; }

  td {
    padding: 9px 14px;
    vertical-align: middle;
  }
  td:first-child { text-align: center; }

  /* Checkbox */
  input[type=checkbox] {
    appearance: none;
    width: 15px; height: 15px;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
    cursor: pointer;
    position: relative;
    transition: border-color 0.1s, background 0.1s;
    flex-shrink: 0;
    vertical-align: middle;
  }
  input[type=checkbox]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  input[type=checkbox]:checked::after {
    content: '';
    position: absolute;
    left: 3px; top: 0px;
    width: 5px; height: 9px;
    border: 2px solid #1a1a18;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
  }

  .title-cell {
    color: var(--text);
    font-size: 13px;
    line-height: 1.35;
  }
  .cat-badge {
    display: inline-block;
    background: rgba(200,135,58,0.12);
    border: 1px solid rgba(200,135,58,0.25);
    color: var(--accent);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .prot-badge {
    display: inline-block;
    background: rgba(90,158,106,0.12);
    border: 1px solid rgba(90,158,106,0.25);
    color: var(--green);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 20px;
  }

  /* ── Empty state ─────────────────────────────────────────────── */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty .icon { font-size: 36px; margin-bottom: 10px; }
  .empty p { font-size: 14px; }

  /* ── Open button bar ─────────────────────────────────────────── */
  .open-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 12px;
  }
  .open-bar .hint {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* ── Link panel ──────────────────────────────────────────────── */
  #linkPanel {
    margin-top: 10px;
    background: var(--surface);
    border: 1px solid var(--accent-dim);
    border-radius: var(--radius);
    overflow: hidden;
    flex-shrink: 0;
    max-height: 220px;
    display: flex;
    flex-direction: column;
  }
  .link-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    flex-shrink: 0;
  }
  #linkList {
    overflow-y: auto;
    padding: 6px 0;
  }
  #linkList::-webkit-scrollbar { width: 5px; }
  #linkList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .link-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 5px 14px;
  }
  .link-item:hover { background: var(--row-hover); }
  .link-num {
    font-size: 10px;
    color: var(--text-dim);
    min-width: 20px;
    text-align: right;
    flex-shrink: 0;
  }
  .link-item a {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    line-height: 1.3;
  }
  .link-item a:hover { text-decoration: underline; }
  .link-item a:visited { color: var(--text-muted); }

  /* ── Delete button ───────────────────────────────────────────── */
  .del-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 15px;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
    transition: color 0.12s, background 0.12s;
  }
  .del-btn:hover { color: #e05555; background: rgba(224,85,85,0.12); }

  /* ── Undo toast ──────────────────────────────────────────────── */
  #undoToast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--text);
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), opacity 0.25s;
    opacity: 0;
    z-index: 999;
    white-space: nowrap;
  }
  #undoToast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  #undoToast button {
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #1a1a18;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
  }
  #undoToast button:hover { opacity: 0.85; }
</style>
</head>
<body>

<header>
  <h1>&#127859; Recipe Bookmarks</h1>
  <span class="subtitle">1,207 recipes &nbsp;&bull;&nbsp; keyword search &amp; filter</span>
</header>

<div class="shell">
  <div class="filters">
    <div class="filter-group">
      <label>Search title</label>
      <input type="text" id="q" placeholder="e.g. chocolate, brisket, enchilada…" autocomplete="off">
    </div>
    <div class="filter-group">
      <label>Category</label>
      <select id="catFilter">
        <option value="">All Categories</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Protein</label>
      <select id="protFilter">
        <option value="">All Proteins</option>
      </select>
    </div>
    <div class="filter-actions">
      <button class="btn btn-ghost" id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="results-wrap">
    <div class="statusbar">
      <span class="count" id="countLabel">Showing <strong>0</strong> recipes</span>
      <span class="sel-count" id="selLabel" style="display:none"></span>
      <span class="spacer"></span>
      <button class="select-all-btn" id="selectAllBtn">Select all visible</button>
    </div>

    <div class="table-scroll" id="tableWrap">
      <table id="recipeTable">
        <thead>
          <tr>
            <th></th>
            <th>Title</th>
            <th>Category</th>
            <th>Protein</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="open-bar">
      <button class="btn btn-primary" id="openBtn" disabled>Open selected in tabs</button>
      <span class="hint" id="openHint">Select one or more recipes, then click to open their links.</span>
    </div>

    <!-- Link panel: shown after clicking "Open selected in tabs" -->
    <div id="linkPanel" style="display:none">
      <div class="link-panel-header">
        <span id="linkPanelLabel"></span>
        <button class="select-all-btn" id="closeLinkPanel">✕ Close</button>
      </div>
      <div id="linkList"></div>
    </div>
  </div>
</div>

<div id="undoToast">
  <span id="undoMsg"></span>
  <button id="undoBtn">Undo</button>
</div>

tegory": "Breads & Flatbreads", "protein": "N/A"}, {"title": "Slow Cooker Cinnamon Sugar Pecans - Upstate Ramblings", "url": "https://www.upstateramblings.com/slow-cooker-cinnamon-sugar-pecans/", "category": "Appetizers & Snacks", "protein": "N/A"}, {"title": "Soft Caramel Candies - Sally&#39;s Baking Addiction", "url": "https://sallysbakingaddiction.com/soft-caramel-candies/", "category": "Candy & Confections", "protein": "N/A"}, {"title": "Spanish Chorizo And Beans Recipe - The Bean Bites", "url": "https://thebeanbites.com/spanish-chorizo-and-beans-recipe/", "category": "Main Dishes", "protein": "Chorizo"}, {"title": "Sushi Rice Recipe | Gimme Some Oven", "url": "https://www.gimmesomeoven.com/sushi-rice/", "category": "Side Dishes & Vegetables", "protein": "N/A"}, {"title": "Tasting Table Recipe: Chile Colorado Recipe", "url": "https://flip.it/qNJhy2", "category": "Main Dishes", "protein": "Beef"}, {"title": "Teriyaki Chicken on a Stick", "url": "https://flip.it/OH5VaE", "category": "Main Dishes", "protein": "Chicken"}, {"title": "The 5 Best Mardi Gras Recipes To Celebrate Fat Tuesday", "url": "https://flip.it/Z_WYPK", "category": "Collections & Roundups", "protein": "N/A"}, {"title": "The BEST All Purpose Gluten Free Flour Mix Recipe", "url": "https://alittleinsanity.com/all-purpose-gluten-free-flour-mix-recipe/", "category": "Breads & Flatbreads", "protein": "N/A"}, {"title": "The Best P.F. Chang’s Mongolian Beef Copycat Recipe", "url": "https://flip.it/sVyPGw", "category": "Main Dishes", "protein": "Beef"}, {"title": "The Best Way To Ensure Fluffy Homemade Flour Tortillas", "url": "https://flip.it/4GWHmt", "category": "Breads & Flatbreads", "protein": "N/A"}, {"title": "The Coziest Winter Comfort Foods", "url": "https://flipboard.com/@tasteofhome/the-coziest-winter-comfort-foods-mbru86viscnnshfn?from=share&utm_source=flipboard&utm_medium=share", "category": "Collections & Roundups", "protein": "N/A"}, {"title": "The Foolproof Way To Make Rice Like A Master Sushi Chef", "url": "https://flip.it/smQaxO", "category": "Side Dishes & Vegetables", "protein": "N/A"}, {"title": "The Most Popular Recipes of 2021", "url": "https://flip.it/V8W2cX", "category": "Collections & Roundups", "protein": "N/A"}, {"title": "The Most Whimsical Way To Use Leftover Rigatoni (If You&#39;re Patient)", "url": "https://flip.it/jc-6fg", "category": "Pasta & Noodles", "protein": "N/A"}, {"title": "These Garlicky Shrimp Tostadas Are My Family’s Current Weeknight Obsession", "url": "https://flip.it/0tDwle", "category": "Main Dishes", "protein": "Shrimp"}, {"title": "This 400-Year Old Italian Mac &amp; Cheese Recipe Has Seriously Stood The Test Of Time", "url": "https://flip.it/4yYsr0", "category": "Side Dishes & Vegetables", "protein": "N/A"}, {"title": "This Savory Lemon Garlic Shrimp Simmered in Butter Sauce Is the Most Satisfying Dish Ever", "url": "https://flip.it/jczW_f", "category": "Main Dishes", "protein": "Shrimp"}, {"title": "Veggie-Loaded Mexican Calabacitas Recipe", "url": "https://flip.it/-DSMw7", "category": "Main Dishes", "protein": "N/A"}, {"title": "With beans comes rice | Homesick Texan", "url": "https://www.homesicktexan.com/2008/06/with-beans-comes-rice.html", "category": "Side Dishes & Vegetables", "protein": "Beans / Legumes"}];
const CATEGORIES = ["Appetizers & Snacks", "Bars & Brownies", "Beverages", "Breads & Flatbreads", "Breakfast & Brunch", "Cakes & Cheesecakes", "Candy & Confections", "Collections & Roundups", "Condiments & Sauces", "Cookies", "Desserts (General)", "Grilling, BBQ & Smoking", "Ice Cream & Frozen Desserts", "Main Dishes", "Muffins", "Mufins", "Pasta & Noodles", "Pies, Tarts & Cobblers", "Puddings & Custards", "Salads", "Sandwiches, Wraps & Tacos", "Side Dishes & Vegetables", "Soups, Stews & Chili", "Tips & Techniques", "⚠️ Needs Review"];
const PROTEINS   = ["Beans / Legumes", "Beef", "Chicken", "Chorizo", "Crab / Crawfish", "Eggs", "Fish (White)", "Lobster", "Mixed Seafood", "N/A", "Plant-Based", "Pork", "Salmon", "Shrimp", "Turkey"];

// ── State ─────────────────────────────────────────────────────────────────────
let filtered  = [];
let selected  = new Set();   // indices into RECIPES[]
let deleted   = new Set();   // indices of soft-deleted recipes
let lastDeleted = [];        // [{idx, recipe}] for undo
let undoTimer  = null;

// ── DOM refs ──────────────────────────────────────────────────────────────────
const qEl         = document.getElementById('q');
const catEl       = document.getElementById('catFilter');
const protEl      = document.getElementById('protFilter');
const clearBtn    = document.getElementById('clearBtn');
const tbody       = document.getElementById('tbody');
const countLabel  = document.getElementById('countLabel');
const selLabel    = document.getElementById('selLabel');
const openBtn     = document.getElementById('openBtn');
const openHint    = document.getElementById('openHint');
const selectAllBtn= document.getElementById('selectAllBtn');

// ── Populate dropdowns ────────────────────────────────────────────────────────
CATEGORIES.forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  catEl.appendChild(o);
});
PROTEINS.forEach(p => {
  const o = document.createElement('option');
  o.value = p; o.textContent = p;
  protEl.appendChild(o);
});

// ── Filter & render ───────────────────────────────────────────────────────────
function applyFilters() {
  const q    = qEl.value.trim().toLowerCase();
  const cat  = catEl.value;
  const prot = protEl.value;

  filtered = RECIPES.filter((r, i) => {
    r._idx = i;
    if (deleted.has(i))                                return false;
    if (q   && !r.title.toLowerCase().includes(q))    return false;
    if (cat && r.category !== cat)                     return false;
    if (prot && r.protein !== prot)                    return false;
    return true;
  });

  renderTable();
  updateStatus();
}

function highlight(text, q) {
  if (!q) return escHtml(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escHtml(text).replace(re, '<mark style="background:rgba(200,135,58,0.35);color:inherit;border-radius:2px;padding:0 1px">$1</mark>');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderTable() {
  const q = qEl.value.trim().toLowerCase();
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="empty"><div class="icon">&#128269;</div><p>No recipes match your filters.</p></div></td></tr>`;
    return;
  }

  const rows = filtered.map(r => {
    const idx = r._idx;
    const chk = selected.has(idx) ? 'checked' : '';
    const selClass = selected.has(idx) ? 'selected' : '';
    return `<tr class="${selClass}" data-idx="${idx}">
      <td><input type="checkbox" ${chk} data-idx="${idx}" onclick="toggleRow(event, ${idx})"></td>
      <td class="title-cell">${highlight(r.title, q)}</td>
      <td><span class="cat-badge">${escHtml(r.category)}</span></td>
      <td>${r.protein ? `<span class="prot-badge">${escHtml(r.protein)}</span>` : ''}</td>
      <td><button class="del-btn" title="Delete this recipe" onclick="deleteRow(event, ${idx})">&#x2715;</button></td>
    </tr>`;
  });
  tbody.innerHTML = rows.join('');

  // Row click to toggle (not on checkbox itself)
  tbody.querySelectorAll('tr[data-idx]').forEach(tr => {
    tr.addEventListener('click', e => {
      if (e.target.type === 'checkbox') return;
      const idx = parseInt(tr.dataset.idx);
      toggleRow(e, idx);
    });
  });
}

function toggleRow(e, idx) {
  if (selected.has(idx)) {
    selected.delete(idx);
  } else {
    selected.add(idx);
  }
  // Update just this row
  const tr  = tbody.querySelector(`tr[data-idx="${idx}"]`);
  const chk = tbody.querySelector(`input[data-idx="${idx}"]`);
  if (tr)  tr.classList.toggle('selected', selected.has(idx));
  if (chk) chk.checked = selected.has(idx);
  updateStatus();
}

// ── Delete & Undo ─────────────────────────────────────────────────────────────
const undoToast = document.getElementById('undoToast');
const undoMsg   = document.getElementById('undoMsg');
const undoBtn   = document.getElementById('undoBtn');

function deleteRow(e, idx) {
  e.stopPropagation();
  lastDeleted = [{ idx, recipe: RECIPES[idx] }];
  deleted.add(idx);
  selected.delete(idx);
  applyFilters();
  showUndoToast(1);
}

function showUndoToast(count) {
  undoMsg.textContent = `${count} recipe removed`;
  undoToast.classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => {
    undoToast.classList.remove('show');
    lastDeleted = [];
  }, 5000);
}

undoBtn.addEventListener('click', () => {
  lastDeleted.forEach(({ idx }) => deleted.delete(idx));
  lastDeleted = [];
  clearTimeout(undoTimer);
  undoToast.classList.remove('show');
  applyFilters();
});

function updateStatus() {
  const delCount = deleted.size > 0 ? ` <span style="color:var(--text-dim);font-weight:normal">(${deleted.size} hidden)</span>` : '';
  countLabel.innerHTML = `Showing <strong>${filtered.length}</strong> recipe${filtered.length !== 1 ? 's' : ''}${delCount}`;
  const n = selected.size;
  if (n > 0) {
    selLabel.style.display = '';
    selLabel.textContent = `${n} selected`;
    openBtn.disabled = false;
    openHint.textContent = `Click to open ${n} link${n > 1 ? 's' : ''} in new tab${n > 1 ? 's' : ''}.`;
  } else {
    selLabel.style.display = 'none';
    openBtn.disabled = true;
    openHint.textContent = 'Select one or more recipes, then click to open their links.';
  }
}

// ── Select all visible ────────────────────────────────────────────────────────
selectAllBtn.addEventListener('click', () => {
  const allSelected = filtered.every(r => selected.has(r._idx));
  filtered.forEach(r => {
    if (allSelected) selected.delete(r._idx);
    else             selected.add(r._idx);
  });
  selectAllBtn.textContent = allSelected ? 'Select all visible' : 'Deselect all visible';
  renderTable();
  updateStatus();
});

// Reset label on next filter
function resetSelectAllLabel() {
  selectAllBtn.textContent = 'Select all visible';
}

// ── Open tabs ─────────────────────────────────────────────────────────────────
const linkPanel      = document.getElementById('linkPanel');
const linkList       = document.getElementById('linkList');
const linkPanelLabel = document.getElementById('linkPanelLabel');
const closeLinkPanel = document.getElementById('closeLinkPanel');

openBtn.addEventListener('click', () => {
  const items = [...selected].map(i => RECIPES[i]).filter(r => r.url);
  if (items.length === 0) return;

  // Build a panel of real <a target="_blank"> links.
  // Firefox never blocks these — the user clicks each one themselves.
  linkPanelLabel.textContent = `${items.length} link${items.length > 1 ? 's' : ''} ready — click each to open`;
  linkList.innerHTML = items.map((r, i) =>
    `<div class="link-item">
      <span class="link-num">${i + 1}</span>
      <a href="${escHtml(r.url)}" target="_blank" rel="noopener noreferrer">${escHtml(r.title)}</a>
    </div>`
  ).join('');
  linkPanel.style.display = 'flex';
  linkPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

closeLinkPanel.addEventListener('click', () => {
  linkPanel.style.display = 'none';
  linkList.innerHTML = '';
});

// ── Clear filters ─────────────────────────────────────────────────────────────
clearBtn.addEventListener('click', () => {
  qEl.value = '';
  catEl.value = '';
  protEl.value = '';
  selected.clear();
  resetSelectAllLabel();
  applyFilters();
});

// ── Event listeners ───────────────────────────────────────────────────────────
qEl.addEventListener('input', () => { selected.clear(); resetSelectAllLabel(); applyFilters(); });
catEl.addEventListener('change', () => { selected.clear(); resetSelectAllLabel(); applyFilters(); });
protEl.addEventListener('change', () => { selected.clear(); resetSelectAllLabel(); applyFilters(); });

// ── Init ──────────────────────────────────────────────────────────────────────
applyFilters();
</script>
</body>
</html>
