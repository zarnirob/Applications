<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Bookmarks</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #1a1a18;
    --surface:     #242420;
    --surface2:    #2e2e29;
    --border:      #3a3a34;
    --accent:      #c8873a;
    --accent-dim:  #8a5a22;
    --accent-glow: rgba(200,135,58,0.18);
    --text:        #e8e4da;
    --text-muted:  #8a8678;
    --text-dim:    #5a5850;
    --green:       #5a9e6a;
    --row-alt:     rgba(255,255,255,0.025);
    --row-hover:   rgba(200,135,58,0.08);
    --row-sel:     rgba(200,135,58,0.15);
    --radius:      6px;
    --ff-display:  'Georgia', 'Times New Roman', serif;
    --ff-body:     'Segoe UI', system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--ff-body);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px 14px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  header h1 {
    font-family: var(--ff-display);
    font-size: 22px;
    font-weight: normal;
    color: var(--accent);
  }
  header .subtitle {
    color: var(--text-muted);
    font-size: 12px;
    text-transform: uppercase;
  }

  .shell {
    display: grid;
    grid-template-rows: auto 1fr;
    height: calc(100vh - 57px);
  }

  .filters {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    gap: 14px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .filter-group { display: flex; flex-direction: column; gap: 5px; }
  .filter-group label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); }
  .filter-group input, .filter-group select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
  }
  .filter-group input { width: 220px; }
  .filter-group select { width: 180px; }

  .search-box-row {
    display: flex;
    gap: 6px;
  }

  .filter-actions { display: flex; gap: 8px; margin-left: auto; align-items: flex-end; }
  .btn {
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 18px;
  }
  .btn-primary { background: var(--accent); color: #1a1a18; }
  .btn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); }

  .results-wrap { display: flex; flex-direction: column; padding: 0 28px 20px; overflow: hidden; }
  .statusbar { display: flex; align-items: center; gap: 16px; padding: 10px 0 8px; border-bottom: 1px solid var(--border); }
  .statusbar .count { font-size: 12px; color: var(--text-muted); }
  .statusbar .spacer { flex: 1; }

  .table-scroll { overflow-y: auto; flex: 1; border: 1px solid var(--border); border-radius: var(--radius); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; }
  thead { position: sticky; top: 0; background: var(--surface2); }
  thead th { padding: 10px 14px; text-align: left; font-size: 10px; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); }
  tbody tr:hover { background: var(--row-hover); }
  td { padding: 9px 14px; }

  /* Checkbox styling */
  input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
    width: 15px;
    height: 15px;
  }

  .fav-star {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 4px;
    transition: transform 0.1s ease;
  }
  .fav-star:hover { background: var(--surface2); transform: scale(1.15); }
  .fav-star.active { color: #f5c518; }
  .fav-star.inactive { color: #5a5850; }

  .open-bar { display: flex; align-items: center; gap: 12px; padding-top: 12px; flex-wrap: wrap; }
  
  /* GitHub Sync Panel */
  #ghPanel {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 14px;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .gh-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .gh-field { display: flex; flex-direction: column; gap: 4px; }
  .gh-field label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); }
  .gh-field input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 6px 10px;
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>&#127859; Recipe Bookmarks</h1>
  <span class="subtitle" id="headerSubtitle">GitHub Sync Dashboard</span>
</header>

<div class="shell">
  <div class="filters">
    <div class="filter-group">
      <label>Search title</label>
      <div class="search-box-row">
        <input type="text" id="q" placeholder="Search recipes…" autocomplete="off">
        <button class="btn btn-primary" id="searchBtn" style="padding: 7px 14px;">🔍 Search</button>
      </div>
    </div>
    <div class="filter-group">
      <label>Category</label>
      <select id="catFilter"><option value="">All Categories</option></select>
    </div>
    <div class="filter-group">
      <label>Protein</label>
      <select id="protFilter"><option value="">All Proteins</option></select>
    </div>
    <div class="filter-actions">
      <button class="btn btn-primary" id="openSelectedBtn">🚀 Open Selected (0)</button>
      <button class="btn btn-ghost" id="favFilterBtn">⭐ Favorites Only</button>
      <button class="btn btn-ghost" id="clearBtn">Clear Filters</button>
    </div>
  </div>

  <div class="results-wrap">
    <div class="statusbar">
      <span class="count" id="countLabel">Showing <strong>0</strong> recipes</span>
      <span class="spacer"></span>
      <span id="syncStatus" style="font-size: 12px; color: var(--green);"></span>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width: 40px; text-align: center;"><input type="checkbox" id="selectAll" title="Select All Visible"></th>
            <th style="width: 70px; text-align: center;">Favorite</th>
            <th>Title</th>
            <th>Category</th>
            <th>Protein</th>
            <th>Date Added</th>
            <th style="width: 40px;"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="open-bar">
      <button class="btn btn-primary" id="openGhToggle">🐙 GitHub Cloud Sync Settings</button>
      <button class="btn btn-ghost" id="fetchGhBtn">⬇ Fetch from GitHub</button>
      <button class="btn btn-ghost" id="pushGhBtn">⬆ Commit & Save to GitHub</button>
    </div>

    <!-- GitHub Sync Credentials Drawer -->
    <div id="ghPanel" style="display:none;">
      <div style="font-size: 12px; font-weight: 700; color: var(--accent);">GitHub Repository Sync Config</div>
      <div class="gh-row">
        <div class="gh-field">
          <label>Owner / Username</label>
          <input type="text" id="ghOwner" placeholder="zarnirob">
        </div>
        <div class="gh-field">
          <label>Repository Name</label>
          <input type="text" id="ghRepo" placeholder="Applications">
        </div>
        <div class="gh-field">
          <label>File Path in Repo</label>
          <input type="text" id="ghPath" placeholder="data/recipes.csv">
        </div>
        <div class="gh-field">
          <label>Personal Access Token (PAT)</label>
          <input type="password" id="ghToken" placeholder="github_pat_...">
        </div>
        <button class="btn btn-primary" id="saveGhConfig">Save Settings</button>
      </div>
    </div>
  </div>
</div>

<script>
// Clean non-ASCII characters from headers/tokens
function cleanAscii(str) {
  return String(str || '').replace(/[^\x20-\x7E]/g, '').trim();
}

// State Management & Migration
let rawRecipes = [];
try {
  rawRecipes = JSON.parse(localStorage.getItem('my_recipes')) || [];
} catch (e) {
  rawRecipes = [];
}

let recipes = rawRecipes.map(r => ({
  title: String(r.title || '').trim(),
  url: String(r.url || '').trim(),
  category: String(r.category || 'Uncategorized').trim(),
  protein: String(r.protein || 'N/A').trim(),
  favorite: !!r.favorite,
  added: r.added || new Date().toISOString().split('T')[0]
}));

let currentFilteredRecipes = [];
let favOnly = false;

// DOM Elements
const tbody = document.getElementById('tbody');
const countLabel = document.getElementById('countLabel');
const qInput = document.getElementById('q');
const searchBtn = document.getElementById('searchBtn');
const catSelect = document.getElementById('catFilter');
const protSelect = document.getElementById('protFilter');
const favFilterBtn = document.getElementById('favFilterBtn');
const clearBtn = document.getElementById('clearBtn');
const openSelectedBtn = document.getElementById('openSelectedBtn');
const selectAll = document.getElementById('selectAll');
const syncStatus = document.getElementById('syncStatus');

// GitHub Credentials Elements
const ghPanel = document.getElementById('ghPanel');
const openGhToggle = document.getElementById('openGhToggle');
const saveGhConfig = document.getElementById('saveGhConfig');
const fetchGhBtn = document.getElementById('fetchGhBtn');
const pushGhBtn = document.getElementById('pushGhBtn');

const ghOwner = document.getElementById('ghOwner');
const ghRepo = document.getElementById('ghRepo');
const ghPath = document.getElementById('ghPath');
const ghToken = document.getElementById('ghToken');

// Load stored GitHub Config with 'zarnirob' and 'Applications' defaults
ghOwner.value = cleanAscii(localStorage.getItem('gh_owner')) || 'zarnirob';
ghRepo.value = cleanAscii(localStorage.getItem('gh_repo')) || 'Applications';
ghPath.value = cleanAscii(localStorage.getItem('gh_path')) || 'data/recipes.csv';
ghToken.value = cleanAscii(localStorage.getItem('gh_token'));

openGhToggle.addEventListener('click', () => {
  ghPanel.style.display = ghPanel.style.display === 'none' ? 'flex' : 'none';
});

saveGhConfig.addEventListener('click', () => {
  const cleanOwner = cleanAscii(ghOwner.value) || 'zarnirob';
  const cleanRepository = cleanAscii(ghRepo.value) || 'Applications';
  const cleanFilePath = cleanAscii(ghPath.value) || 'data/recipes.csv';
  const cleanPAT = cleanAscii(ghToken.value);

  localStorage.setItem('gh_owner', cleanOwner);
  localStorage.setItem('gh_repo', cleanRepository);
  localStorage.setItem('gh_path', cleanFilePath);
  localStorage.setItem('gh_token', cleanPAT);

  ghOwner.value = cleanOwner;
  ghRepo.value = cleanRepository;
  ghPath.value = cleanFilePath;
  ghToken.value = cleanPAT;

  syncStatus.textContent = 'GitHub credentials saved!';
  setTimeout(() => syncStatus.textContent = '', 3000);
});

// Helper for GitHub URL paths
function formatGitHubApiUrl(owner, repo, path) {
  const cleanPath = path.replace(/^\/+|\/+$/g, '');
  const encodedPath = cleanPath.split('/').map(encodeURIComponent).join('/');
  return `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodedPath}`;
}

// Dropdowns and Render Logic
function populateDropdowns() {
  const cats = [...new Set(recipes.map(r => r.category).filter(Boolean))].sort();
  const prots = [...new Set(recipes.map(r => r.protein).filter(Boolean))].sort();

  catSelect.innerHTML = '<option value="">All Categories</option>';
  cats.forEach(c => catSelect.add(new Option(c, c)));

  protSelect.innerHTML = '<option value="">All Proteins</option>';
  prots.forEach(p => protSelect.add(new Option(p, p)));
}

function saveData() {
  localStorage.setItem('my_recipes', JSON.stringify(recipes));
}

function updateSelectedCount() {
  const checkboxes = tbody.querySelectorAll('.row-select:checked');
  const count = checkboxes.length;
  openSelectedBtn.textContent = `🚀 Open Selected (${count})`;
}

function render() {
  const q = qInput.value.toLowerCase().trim();
  const cat = catSelect.value;
  const prot = protSelect.value;

  currentFilteredRecipes = recipes.filter(r => {
    if (favOnly && !r.favorite) return false;
    if (cat && r.category !== cat) return false;
    if (prot && r.protein !== prot) return false;
    if (q && !r.title.toLowerCase().includes(q)) return false;
    return true;
  });

  tbody.innerHTML = '';
  countLabel.innerHTML = `Showing <strong>${currentFilteredRecipes.length}</strong> recipes`;
  selectAll.checked = false;

  currentFilteredRecipes.forEach((r) => {
    const origIdx = recipes.indexOf(r);
    const isFav = !!r.favorite;
    const starIcon = isFav ? '⭐' : '☆';
    const starClass = isFav ? 'fav-star active' : 'fav-star inactive';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align: center;">
        <input type="checkbox" class="row-select" data-url="${encodeURIComponent(r.url)}">
      </td>
      <td style="text-align: center;">
        <button class="${starClass}" onclick="toggleFavorite(${origIdx})" title="Toggle Favorite">${starIcon}</button>
      </td>
      <td><a href="${r.url}" target="_blank" style="color:inherit;text-decoration:none;">${r.title}</a></td>
      <td>${r.category || 'Uncategorized'}</td>
      <td>${r.protein || 'N/A'}</td>
      <td style="color:var(--text-muted); font-size:12px;">${r.added || ''}</td>
      <td><button onclick="deleteRecipe(${origIdx})" style="background:none;border:none;color:#e05555;cursor:pointer;" title="Delete Recipe">✕</button></td>
    `;
    tbody.appendChild(tr);
  });

  // Attach checkbox listener for dynamic open count
  tbody.querySelectorAll('.row-select').forEach(cb => {
    cb.addEventListener('change', updateSelectedCount);
  });

  updateSelectedCount();
}

// Master Checkbox "Select All"
selectAll.addEventListener('change', (e) => {
  const isChecked = e.target.checked;
  tbody.querySelectorAll('.row-select').forEach(cb => {
    cb.checked = isChecked;
  });
  updateSelectedCount();
});

// Bulk Open Selected Tabs
openSelectedBtn.addEventListener('click', () => {
  const checkedBoxes = Array.from(tbody.querySelectorAll('.row-select:checked'));
  let urlsToOpen = [];

  if (checkedBoxes.length > 0) {
    urlsToOpen = checkedBoxes.map(cb => decodeURIComponent(cb.dataset.url));
  } else if (currentFilteredRecipes.length > 0) {
    // If no checkboxes checked, offer to open all visible filtered results
    if (confirm(`No individual recipes checked. Do you want to open all ${currentFilteredRecipes.length} visible recipe(s)?`)) {
      urlsToOpen = currentFilteredRecipes.map(r => r.url);
    }
  } else {
    alert("No recipes available to open.");
    return;
  }

  urlsToOpen.forEach(url => {
    if (url) window.open(url, '_blank');
  });
});

function toggleFavorite(idx) {
  if (recipes[idx]) {
    recipes[idx].favorite = !recipes[idx].favorite;
    saveData();
    render();
  }
}

function deleteRecipe(idx) {
  recipes.splice(idx, 1);
  saveData();
  populateDropdowns();
  render();
}

// ── SEARCH & FILTER LISTENERS ──
searchBtn.addEventListener('click', render);
qInput.addEventListener('input', render);
qInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') render();
});

catSelect.addEventListener('change', render);
protSelect.addEventListener('change', render);

favFilterBtn.addEventListener('click', () => {
  favOnly = !favOnly;
  favFilterBtn.classList.toggle('btn-primary', favOnly);
  favFilterBtn.classList.toggle('btn-ghost', !favOnly);
  render();
});

clearBtn.addEventListener('click', () => {
  qInput.value = '';
  catSelect.value = '';
  protSelect.value = '';
  favOnly = false;
  favFilterBtn.classList.remove('btn-primary');
  favFilterBtn.classList.add('btn-ghost');
  render();
});

// Helper for UTF-8 to Base64 encoding
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.byteLength; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

// ── DYNAMIC GITHUB API IMPORT (FETCH) ──
async function fetchFromGitHub() {
  const owner = cleanAscii(localStorage.getItem('gh_owner')) || 'zarnirob';
  const repo = cleanAscii(localStorage.getItem('gh_repo')) || 'Applications';
  const path = cleanAscii(localStorage.getItem('gh_path')) || 'data/recipes.csv';
  const token = cleanAscii(localStorage.getItem('gh_token'));

  if (!owner || !repo || !path) {
    alert("Please fill in Owner, Repository, and File Path in settings.");
    return;
  }

  syncStatus.textContent = `Fetching '${path}' from GitHub...`;

  try {
    const apiUrl = formatGitHubApiUrl(owner, repo, path);
    const headers = { "Accept": "application/vnd.github.v3.raw" };
    if (token) headers["Authorization"] = `Bearer ${token}`;

    const res = await fetch(apiUrl, { headers });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: Check that '${path}' exists in '${repo}'.`);
    }

    const rawText = await res.text();
    let fetchedRecipes = [];
    let isJsonParsed = false;

    // Safe JSON check
    if (rawText.trim().startsWith('[') || rawText.trim().startsWith('{')) {
      try {
        const data = JSON.parse(rawText);
        const arrayData = Array.isArray(data) ? data : [data];
        arrayData.forEach((r) => {
          if (r && (r.title || r.url)) {
            fetchedRecipes.push({
              title: r.title || '',
              url: r.url || '',
              category: r.category || 'Uncategorized',
              protein: r.protein || 'N/A',
              favorite: !!r.favorite,
              added: r.added || new Date().toISOString().split('T')[0]
            });
          }
        });
        isJsonParsed = true;
      } catch (e) {
        console.warn("JSON parse attempt failed, falling back to CSV parsing:", e);
      }
    }

    // CSV Parse Fallback
    if (!isJsonParsed) {
      const lines = rawText.split(/\r\n|\n/);
      lines.forEach((line, index) => {
        if (index === 0 && line.toLowerCase().includes('title')) return;
        if (!line.trim()) return;

        const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"\vert{}"$/g, '').trim());
        
        if (cols.length >= 2 && cols[0] && cols[1]) {
          const isFav = cols[4] ? ['true', '1', 'yes'].includes(cols[4].toLowerCase()) : false;

          fetchedRecipes.push({
            title: cols[0],
            url: cols[1],
            category: cols[2] || 'Uncategorized',
            protein: cols[3] || 'N/A',
            favorite: isFav,
            added: cols[5] || new Date().toISOString().split('T')[0]
          });
        }
      });
    }

    recipes = fetchedRecipes;
    saveData();
    populateDropdowns();
    render();
    syncStatus.textContent = `✓ Successfully loaded '${path}'!`;
  } catch (err) {
    syncStatus.textContent = `Fetch Error: ${err.message}`;
    console.error("Fetch Detail:", err);
  }
}

// ── DYNAMIC GITHUB API EXPORT (SAVE) ──
async function pushToGitHub() {
  const owner = cleanAscii(localStorage.getItem('gh_owner')) || 'zarnirob';
  const repo = cleanAscii(localStorage.getItem('gh_repo')) || 'Applications';
  const path = cleanAscii(localStorage.getItem('gh_path')) || 'data/recipes.csv';
  const token = cleanAscii(localStorage.getItem('gh_token'));

  if (!owner || !repo || !path || !token) {
    alert("Owner, Repository, File Path, and Personal Access Token are all required in settings.");
    ghPanel.style.display = 'flex';
    return;
  }

  syncStatus.textContent = `Saving '${path}' to GitHub...`;

  try {
    const apiUrl = formatGitHubApiUrl(owner, repo, path);

    let sha = null;
    const getRes = await fetch(apiUrl, {
      headers: { 
        "Authorization": `Bearer ${token}`, 
        "Accept": "application/vnd.github+json" 
      }
    });

    if (getRes.ok) {
      try {
        const fileData = await getRes.json();
        sha = fileData.sha || null;
      } catch (e) {
        console.warn("Could not parse file sha metadata:", e);
      }
    }

    let fileContentString = "";

    if (path.toLowerCase().endsWith('.csv')) {
      fileContentString = "Title,URL,Category,Protein,Favorite,Added\n";
      recipes.forEach((r) => {
        const title = `"${(r.title || '').replace(/"/g, '""')}"`;
        const url = `"${(r.url || '').replace(/"/g, '""')}"`;
        const cat = `"${(r.category || '').replace(/"/g, '""')}"`;
        const prot = `"${(r.protein || '').replace(/"/g, '""')}"`;
        const isFav = r.favorite ? "true" : "false";
        const added = `"${(r.added || new Date().toISOString().split('T')[0]).replace(/"/g, '""')}"`;

        fileContentString += `${title},${url},${cat},${prot},${isFav},${added}\n`;
      });
    } else {
      fileContentString = JSON.stringify(recipes, null, 2);
    }

    const contentEncoded = utf8ToBase64(fileContentString);

    const payload = {
      message: `Update ${path} via Recipe Dashboard`,
      content: contentEncoded
    };
    if (sha) {
      payload.sha = sha;
    }

    const putRes = await fetch(apiUrl, {
      method: "PUT",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json",
        "Accept": "application/vnd.github+json"
      },
      body: JSON.stringify(payload)
    });

    if (!putRes.ok) {
      let detailedMsg = `HTTP ${putRes.status}`;
      try {
        const errData = await putRes.json();
        detailedMsg = errData.message || putRes.statusText || detailedMsg;
      } catch (e) {
        const rawErrText = await putRes.text().catch(() => '');
        detailedMsg = rawErrText || putRes.statusText || detailedMsg;
      }
      throw new Error(detailedMsg);
    }

    syncStatus.textContent = `✓ Successfully committed '${path}' to GitHub!`;
  } catch (err) {
    syncStatus.textContent = `Save Error: ${err.message}`;
    console.error("Save Detail:", err);
  }
}

fetchGhBtn.addEventListener('click', fetchFromGitHub);
pushGhBtn.addEventListener('click', pushToGitHub);

// ── EXTENSION POPUP LISTENER & DEDUPLICATION GUARD ──
let lastAddedUrl = "";
let lastAddedTime = 0;

function handleExtensionRecipe(rawRecipe) {
  if (!rawRecipe) return;

  const currentUrl = String(rawRecipe.url || '').trim();
  const now = Date.now();

  // Prevent duplicate additions within 2 seconds
  if (currentUrl === lastAddedUrl && (now - lastAddedTime) < 2000) {
    return;
  }

  lastAddedUrl = currentUrl;
  lastAddedTime = now;

  const newRecipe = {
    title: String(rawRecipe.title || '').trim(),
    url: currentUrl,
    category: String(rawRecipe.category || 'Uncategorized').trim(),
    protein: String(rawRecipe.protein || 'N/A').trim(),
    favorite: false,
    added: new Date().toISOString().split('T')[0]
  };

  recipes.unshift(newRecipe);
  saveData();
  populateDropdowns();
  render();
  syncStatus.textContent = `✓ Added "${newRecipe.title}" from extension!`;
}

window.addEventListener("ExtensionAddRecipe", (e) => {
  if (e.detail) {
    try {
      const data = typeof e.detail === "string" ? JSON.parse(e.detail) : e.detail;
      handleExtensionRecipe(data);
    } catch (err) {
      console.error("Failed to parse recipe detail:", err);
    }
  }
});

// Initialization
populateDropdowns();
render();
</script>
</body>
</html>
